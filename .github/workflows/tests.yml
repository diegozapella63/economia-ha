name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unitários e integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Página montada a partir da fonte
        run: python3 tools/montar_pagina.py --conferir
      - name: Testes
        run: TZ=America/Sao_Paulo python3 -m unittest discover -s tests -p "test_*.py" -v

  visual:
    name: Visuais (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: tests/e2e/run.sh
        env:
          E2E_TMP: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e-saidas
          path: ${{ runner.temp }}/e2e
          retention-days: 7
