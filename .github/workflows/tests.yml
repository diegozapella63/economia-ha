name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unitários e integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Página montada a partir da fonte
        run: python3 tools/montar_pagina.py --conferir
      - name: Testes e cobertura de linhas (mínimo 97%)
        run: TZ=America/Sao_Paulo python3 tools/cobertura.py --minimo 97 --linhas --resumo "$GITHUB_STEP_SUMMARY"

  visual:
    name: Visuais (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: tests/e2e/run.sh
        env:
          E2E_TMP: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e-saidas
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  # os arquivos que são iguais nos apps da família (tools/iguais.py): baixa os outros apps e compara
  iguais:
    name: Arquivos iguais aos dos outros apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: economia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/gerencia-ha
          path: gerencia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/inventario-ha
          path: inventario-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/CorrerIA-ha
          path: correria-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/resolvia-ha
          path: resolvia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/cronologia-ha
          path: cronologia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/memoria-ha
          path: memoria-ha
      - run: python3 economia-ha/tools/iguais.py --exigir
